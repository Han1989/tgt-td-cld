# T-00: check every pull request to main and every push to main.
# The branch-protection required check is the job named `ci` (job id and check name).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: npm

      - name: Require Node 22.12 or newer
        run: node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if (maj<22 || (maj===22 && min<12)) { console.error("Node " + process.version + " is below 22.12"); process.exit(1); } console.log(process.version)'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Browser tests are several minutes (the stress project runs alone at the end).
      # Run them when the client, the shared packages, or this workflow change.
      - name: Decide whether browser tests apply
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "$zero" ]; then
            echo "No base commit to compare; running browser tests."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base ${BASE_SHA} is not in this clone; running browser tests."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "${BASE_SHA}" HEAD -- apps/client packages .github/workflows/ci.yml)"
          if [ -n "$files" ]; then
            echo "Browser tests apply:"
            printf '%s\n' "$files"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under apps/client, packages, or .github/workflows/ci.yml; skipping browser tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '22'
          check-latest: true
          cache: npm

      - name: Require Node 22.12 or newer
        if: steps.changes.outputs.run == 'true'
        run: node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if (maj<22 || (maj===22 && min<12)) { console.error("Node " + process.version + " is below 22.12"); process.exit(1); } console.log(process.version)'

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        if: steps.changes.outputs.run == 'true'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.changes.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        if: steps.changes.outputs.run == 'true'
        run: npm run test:e2e

  # Required status check. Passes only when `test` succeeded and `e2e` succeeded
  # or was skipped (docs-only pushes skip the browser steps and this job still succeeds).
  ci:
    name: ci
    needs: [test, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require test success and e2e success or skip
        env:
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          echo "test=${TEST_RESULT}"
          echo "e2e=${E2E_RESULT}"
          if [ "${TEST_RESULT}" != "success" ]; then
            echo "test must succeed (got ${TEST_RESULT})."
            exit 1
          fi
          if [ "${E2E_RESULT}" != "success" ] && [ "${E2E_RESULT}" != "skipped" ]; then
            echo "e2e must succeed or be skipped (got ${E2E_RESULT})."
            exit 1
          fi
